name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            openjdk-17-jdk \
            python3-venv \
            autoconf \
            automake \
            autopoint \
            libtool \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            libffi-dev \
            libssl-dev \
            cmake \
            build-essential \
            patch \
            gettext \
            lbzip2 \
            ccache

      - name: Install Rust
        run: |
          set -eux

          curl https://sh.rustup.rs -sSf | sh -s -- -y

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

          source "$HOME/.cargo/env"

          rustc --version
          cargo --version

      - name: Install Buildozer
        run: |
          set -eux

          python -m pip install --upgrade pip

          python -m pip install \
            git+https://github.com/kivy/buildozer.git

          python -m pip install \
            legacy-cgi \
            setuptools \
            "cython==0.29.34"

      - name: Clean previous Android build state
        run: |
          set -eux

          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin

      - name: Prepare Android SDK
        run: |
          set -eux

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          rm -rf "$SDK"

          mkdir -p "$SDK/cmdline-tools"

          cd /tmp

          rm -rf cmdline-tools commandlinetools.zip

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
            -O commandlinetools.zip

          unzip -q commandlinetools.zip

          mkdir -p "$SDK/cmdline-tools/latest"

          mv cmdline-tools/* "$SDK/cmdline-tools/latest/"

          # Compatibility paths required by older Buildozer/p4a code.
          mkdir -p "$SDK/tools/bin"

          ln -sf \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/tools/bin/sdkmanager"

          ln -sf \
            "$SDK/cmdline-tools/latest/bin/avdmanager" \
            "$SDK/tools/bin/avdmanager"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/tools/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"

          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/tools/bin:$SDK/platform-tools:$PATH"

          echo "=== sdkmanager ==="

          "$SDK/tools/bin/sdkmanager" --version

          echo "=== accepting licenses ==="

          yes | "$SDK/tools/bin/sdkmanager" --licenses >/dev/null || true

          echo "=== installing Android packages ==="

          "$SDK/tools/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

          echo "=== installed packages ==="

          "$SDK/tools/bin/sdkmanager" --list_installed

      - name: Verify Android tools
        run: |
          set -eux

          SDK="$ANDROID_HOME"

          echo "=== SDK ==="
          test -d "$SDK"

          echo "=== platform ==="
          test -d "$SDK/platforms/android-36"

          echo "=== build-tools ==="
          test -d "$SDK/build-tools/36.0.0"

          echo "=== AIDL ==="
          test -x "$SDK/build-tools/36.0.0/aidl"
          "$SDK/build-tools/36.0.0/aidl" --version

          echo "=== NDK ==="
          test -d "$SDK/ndk/28.2.13676358"

          echo "=== sdkmanager compatibility path ==="
          test -x "$SDK/tools/bin/sdkmanager"

          "$SDK/tools/bin/sdkmanager" --version

          echo "Android toolchain verification: PASSED"

      - name: Verify project configuration
        run: |
          set -eux

          echo "=== buildozer.spec ==="
          cat buildozer.spec

          echo "=== architecture check ==="

          grep -E '^android\.archs[[:space:]]*=' buildozer.spec

          if grep -q "armeabi-v7a" buildozer.spec; then
            echo "ERROR: obsolete armeabi-v7a configuration detected."
            exit 1
          fi

          echo "Architecture configuration: arm64-v8a only"

      - name: Verify Python build environment
        run: |
          set -eux

          echo "=== Python ==="
          python --version

          echo "=== pip ==="
          python -m pip --version

          echo "=== Cython ==="
          cython --version

          echo "=== Java ==="
          java -version

          echo "=== Buildozer ==="
          buildozer --version

      - name: Build APK
        run: |
          set -o pipefail

          buildozer android debug 2>&1 | tee build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AI-Video-Editor
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AI-Video-Editor-Build-Log
          path: |
            build.log
            .buildozer/android/platform/python-for-android/**/*.log
          if-no-files-found: warn
