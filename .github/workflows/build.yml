name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            openjdk-17-jdk \
            autoconf \
            automake \
            autopoint \
            libtool \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            libffi-dev \
            libssl-dev \
            cmake \
            build-essential \
            patch \
            gettext \
            lbzip2 \
            ccache

      - name: Install Buildozer and build dependencies
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            git+https://github.com/kivy/buildozer.git

          python -m pip install \
            legacy-cgi \
            setuptools \
            "cython==0.29.34"

      - name: Prepare Android SDK
        run: |
          set -e

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK/cmdline-tools"

          cd /tmp

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
            -O commandlinetools.zip

          unzip -q commandlinetools.zip

          mkdir -p "$SDK/cmdline-tools/latest"

          mv cmdline-tools/* "$SDK/cmdline-tools/latest/"

          # Buildozer/p4a compatibility path
          mkdir -p "$SDK/tools/bin"

          ln -sf \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/tools/bin/sdkmanager"

          ln -sf \
            "$SDK/cmdline-tools/latest/bin/avdmanager" \
            "$SDK/tools/bin/avdmanager"

          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"

          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/tools/bin:$SDK/platform-tools:$PATH"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/tools/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          echo "Checking sdkmanager..."
          "$SDK/tools/bin/sdkmanager" --version

          echo "Accepting Android SDK licenses..."
          yes | "$SDK/tools/bin/sdkmanager" --licenses || true

          echo "Installing Android SDK packages..."

          "$SDK/tools/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

          echo "Android SDK packages installed."

      - name: Verify build environment
        run: |
          echo "Python:"
          python --version

          echo "Pip:"
          python -m pip --version

          echo "Cython:"
          cython --version

          echo "Java:"
          java -version

          echo "Buildozer:"
          buildozer --version

          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo "Android NDK:"
          ls -la "$ANDROID_HOME/ndk"

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Video-Editor
          path: bin/*.apk
          if-no-files-found: error
